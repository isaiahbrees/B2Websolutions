<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReelWorks</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Reel<span>Works</span></h1>
    <div class="topbar-right">
      <span id="user-email" class="muted"></span>
      <button id="logout" class="btn btn-ghost">Sign out</button>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <h2>New reel</h2>
      <form id="job-form">
        <label>Old site URL <span class="hint">tip: use a web.archive.org snapshot if it's already replaced</span>
          <input type="url" name="beforeUrl" required placeholder="https://web.archive.org/web/2024/https://old-site.com" />
        </label>
        <label>New site URL
          <input type="url" name="afterUrl" required placeholder="https://shiny-new-site.com" />
        </label>
        <label>Business name
          <input type="text" name="clientName" required placeholder="Acme Plumbing" />
        </label>

        <div class="row">
          <label>Template
            <select name="template">
              <option value="clean">Clean Agency (white)</option>
              <option value="dark">Dark Luxury</option>
              <option value="split">Split Comparison</option>
            </select>
          </label>
          <label>Camera
            <select name="intensity">
              <option value="subtle">Subtle</option>
              <option value="balanced" selected>Balanced</option>
              <option value="cinematic">Cinematic</option>
            </select>
          </label>
          <label>Scroll speed
            <select name="scrollSpeed">
              <option value="slow">Slow &amp; cinematic</option>
              <option value="medium" selected>Medium (social)</option>
              <option value="fast">Fast overview</option>
            </select>
          </label>
        </div>

        <details class="advanced">
          <summary>Copy &amp; branding</summary>
          <label>Intro title
            <input type="text" name="title" placeholder="Website Redesign" />
          </label>
          <div class="row">
            <label>Before label
              <input type="text" name="beforeLabel" placeholder="BEFORE" />
            </label>
            <label>After label
              <input type="text" name="afterLabel" placeholder="AFTER" />
            </label>
          </div>
          <label>End-card tagline
            <input type="text" name="tagline" placeholder="Your website should work as hard as you do." />
          </label>
          <label>End-card CTA
            <input type="text" name="cta" placeholder="Message us for a redesign" />
          </label>
          <label>Facebook caption
            <textarea name="caption" rows="3" placeholder="Defaults to title + CTA"></textarea>
          </label>
          <div class="row">
            <label>Brand name
              <input type="text" name="brandName" placeholder="B2 Web Solutions" />
            </label>
            <label>Accent
              <input type="color" name="accentColor" value="#0a84ff" />
            </label>
          </div>
          <label>Logo image URL <span class="hint">e.g. the logo file from your own website</span>
            <input type="url" name="logoUrl" placeholder="https://b2websolutions.com/logo.png" />
          </label>
        </details>

        <details class="advanced">
          <summary>Output settings</summary>
          <div class="row">
            <label>Resolution
              <select name="resolution">
                <option value="1080" selected>1080 × 1920 (Reel)</option>
                <option value="2160">2160 × 3840 (4K — slow)</option>
              </select>
            </label>
            <label>Frame rate
              <select name="fps">
                <option value="60" selected>60 fps (smoothest)</option>
                <option value="30">30 fps (faster render)</option>
              </select>
            </label>
            <label>Target length
              <select name="durationTarget">
                <option value="">Auto (fit the sites)</option>
                <option value="20">~20 seconds</option>
                <option value="27">~27 seconds</option>
                <option value="35">~35 seconds</option>
              </select>
            </label>
          </div>
          <label>Music URL <span class="hint">optional mp3 — fades in/out automatically; leave empty for silent</span>
            <input type="url" name="musicUrl" placeholder="https://…/track.mp3" />
          </label>
        </details>

        <div class="row">
          <label>After rendering
            <select name="postVia">
              <option value="">Just render (preview first)</option>
              <option value="reel">Post as Facebook Reel</option>
              <option value="facebook">Post as feed video</option>
              <option value="make">Send to Make.com</option>
            </select>
          </label>
          <button type="submit" class="btn btn-primary">Create reel</button>
        </div>
        <p id="job-error" class="error" hidden></p>
      </form>
    </section>

    <section>
      <h2>Jobs</h2>
      <div id="jobs" class="jobs"></div>
      <p id="no-jobs" class="muted" hidden>No reels yet — create your first one above.</p>
    </section>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
