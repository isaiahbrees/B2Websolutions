<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — ReelForge</title>
  <link rel="stylesheet" href="/assets/theme.css" />
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:20px">
    <form id="login-form" class="card card-pad" style="width:100%;max-width:360px;display:grid;gap:14px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:4px">
        <span class="logo-mark">R</span><span style="font-weight:700;font-size:15px">ReelForge</span>
      </div>
      <div>
        <h1 style="font-size:19px">Welcome back</h1>
        <p class="muted small" style="margin-top:4px">Turn website redesigns into scroll-stopping videos.</p>
      </div>
      <div class="field"><label>Email</label><input class="input" type="email" name="email" required autocomplete="username" /></div>
      <div class="field"><label>Password</label><input class="input" type="password" name="password" required autocomplete="current-password" /></div>
      <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
      <p id="login-error" class="small" style="color:var(--red)" hidden></p>
      <p class="small faint">Private beta — accounts are provisioned by the workspace owner.</p>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errEl = document.getElementById('login-error');
      errEl.hidden = true;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: form.email.value, password: form.password.value }),
      });
      if (res.ok) location.href = '/app';
      else {
        const body = await res.json().catch(() => ({}));
        errEl.textContent = body.error || 'Login failed';
        errEl.hidden = false;
      }
    });
  </script>
</body>
</html>
