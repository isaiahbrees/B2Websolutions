<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brand kits — ReelForge</title>
  <link rel="stylesheet" href="/assets/theme.css" />
</head>
<body>
  <div class="shell">
    <main class="main">
      <div class="page-head">
        <div><h1>Brand kits</h1><p class="sub">Save a client’s branding once — every new reel applies it automatically.</p></div>
        <button class="btn btn-primary" id="btn-new">+ New brand kit</button>
      </div>
      <div class="grid2" id="kits"></div>
      <div class="empty" id="empty" hidden>
        <div class="icon">🎨</div>
        <h3>No brand kits yet</h3>
        <p>A brand kit stores a client’s name, colors, logo, CTA and end-card message so every reel is on-brand without retyping.</p>
        <button class="btn btn-primary" onclick="openEditor()">Create your first kit</button>
      </div>

      <div class="card card-pad" id="editor" hidden style="max-width:620px;margin-top:20px">
        <h2 style="margin-bottom:16px" id="editor-title">New brand kit</h2>
        <div style="display:grid;gap:14px">
          <input type="hidden" id="k-id" />
          <div class="grid2">
            <div class="field"><label>Kit name</label><input class="input" id="k-name" placeholder="Acme Plumbing" /></div>
            <div class="field"><label>Brand name (shown in video)</label><input class="input" id="k-brandName" placeholder="Acme Plumbing" /></div>
          </div>
          <div class="grid2">
            <div class="field"><label>Website</label><input class="input" id="k-website" placeholder="https://acme.com" /></div>
            <div class="field"><label>Social handle</label><input class="input" id="k-socialHandle" placeholder="@acmeplumbing" /></div>
          </div>
          <div class="grid3">
            <div class="field"><label>Primary</label><input type="color" class="input" id="k-primaryColor" value="#1d1d1f" /></div>
            <div class="field"><label>Accent</label><input type="color" class="input" id="k-accentColor" value="#0a84ff" /></div>
            <div class="field"><label>Logo</label>
              <div style="display:flex;gap:8px;align-items:center">
                <img id="k-logo-preview" hidden style="height:34px;max-width:80px;object-fit:contain;border-radius:6px;border:1px solid var(--border)" />
                <label class="btn btn-sm" style="cursor:pointer">Upload<input type="file" id="k-logo" accept="image/*" hidden /></label>
              </div>
            </div>
          </div>
          <div class="field"><label>Default CTA</label><input class="input" id="k-defaultCta" placeholder="Message us for a redesign" /></div>
          <div class="field"><label>End-card message</label><input class="input" id="k-endCardMessage" placeholder="Your website should work as hard as you do." /></div>
          <div class="field"><label>Music preference</label>
            <select class="input" id="k-musicPreference">
              <option value="none">No music</option><option value="cinematic">Cinematic</option><option value="uplifting">Uplifting</option>
              <option value="modern-tech">Modern tech</option><option value="minimal">Minimal</option><option value="luxury">Luxury</option><option value="energetic">Energetic</option>
            </select>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn" onclick="closeEditor()">Cancel</button>
            <button class="btn btn-primary" id="btn-save">Save brand kit</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/assets/shell.js"></script>
  <script>
    Shell.mount('brand');
    const { api, esc, toast, modal, upgradeModal } = Shell;
    let logoAssetId = null;
    let defaultKitId = null;

    async function refresh() {
      const [kits, ws] = await Promise.all([api('/api/brandkits'), api('/api/workspace')]);
      defaultKitId = ws.defaultBrandKitId;
      document.getElementById('empty').hidden = kits.length > 0;
      document.getElementById('kits').innerHTML = kits.map((k) => `
        <div class="card card-pad" style="display:grid;gap:10px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="display:flex;gap:10px;align-items:center">
              ${k.logoAssetId ? `<img src="/api/assets/${k.logoAssetId}/file" style="height:28px;max-width:70px;object-fit:contain">` : `<span style="width:28px;height:28px;border-radius:8px;background:${k.accentColor};display:inline-block"></span>`}
              <div><div style="font-weight:650">${esc(k.name)}</div><div class="small faint">${esc(k.website || 'no website')}</div></div>
            </div>
            ${k.id === defaultKitId ? '<span class="badge badge-blue">Default</span>' : ''}
          </div>
          <div style="display:flex;gap:6px">
            ${[k.primaryColor, k.accentColor].map((c) => `<span style="width:20px;height:20px;border-radius:6px;background:${c};border:1px solid var(--border)"></span>`).join('')}
            <span class="small faint" style="margin-left:6px">${esc(k.defaultCta)}</span>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-sm" data-edit="${k.id}">Edit</button>
            ${k.id !== defaultKitId ? `<button class="btn btn-sm" data-default="${k.id}">Make default</button>` : ''}
            <button class="btn btn-sm btn-danger" data-del="${k.id}">Delete</button>
          </div>
        </div>`).join('');
      document.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => openEditor(kits.find((k) => k.id === b.dataset.edit))));
      document.querySelectorAll('[data-default]').forEach((b) => (b.onclick = async () => { await api(`/api/brandkits/${b.dataset.default}/default`, { method: 'POST' }); toast('Default updated'); refresh(); }));
      document.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => modal({
        title: 'Delete brand kit?', body: 'Existing projects keep their styling; new projects just won’t offer this kit.',
        actions: [{ label: 'Cancel' }, { label: 'Delete', danger: true, onClick: async () => { await api(`/api/brandkits/${b.dataset.del}`, { method: 'DELETE' }); refresh(); } }],
      })));
    }

    function openEditor(kit) {
      document.getElementById('editor').hidden = false;
      document.getElementById('editor-title').textContent = kit ? `Edit ${kit.name}` : 'New brand kit';
      logoAssetId = kit?.logoAssetId ?? null;
      const set = (f, v) => (document.getElementById(`k-${f}`).value = v ?? '');
      set('id', kit?.id); set('name', kit?.name); set('brandName', kit?.brandName); set('website', kit?.website);
      set('socialHandle', kit?.socialHandle); set('primaryColor', kit?.primaryColor ?? '#1d1d1f');
      set('accentColor', kit?.accentColor ?? '#0a84ff'); set('defaultCta', kit?.defaultCta);
      set('endCardMessage', kit?.endCardMessage); set('musicPreference', kit?.musicPreference ?? 'none');
      const prev = document.getElementById('k-logo-preview');
      prev.hidden = !logoAssetId;
      if (logoAssetId) prev.src = `/api/assets/${logoAssetId}/file`;
      document.getElementById('editor').scrollIntoView({ behavior: 'smooth' });
    }
    function closeEditor() { document.getElementById('editor').hidden = true; }
    document.getElementById('btn-new').onclick = () => openEditor();

    document.getElementById('k-logo').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
      const asset = await api('/api/assets', { method: 'POST', body: JSON.stringify({ kind: 'logo', name: file.name, dataUrl }) });
      logoAssetId = asset.id;
      const prev = document.getElementById('k-logo-preview');
      prev.hidden = false; prev.src = `/api/assets/${asset.id}/file`;
      toast('Logo uploaded');
    });

    document.getElementById('btn-save').onclick = async () => {
      const val = (f) => document.getElementById(`k-${f}`).value.trim();
      try {
        await api('/api/brandkits', { method: 'POST', body: JSON.stringify({
          id: val('id') || undefined, name: val('name'), brandName: val('brandName'), website: val('website'),
          socialHandle: val('socialHandle'), primaryColor: val('primaryColor'), accentColor: val('accentColor'),
          defaultCta: val('defaultCta'), endCardMessage: val('endCardMessage'), musicPreference: val('musicPreference'),
          logoAssetId,
        }) });
        toast('Brand kit saved');
        closeEditor();
        refresh();
      } catch (err) { err.upgradeTo ? upgradeModal(err.message, err.upgradeTo) : toast(err.message, 'err'); }
    };
    refresh();
  </script>
</body>
</html>
